<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Le Dernier Secret du Garde</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="page">

        <section class="carnet">
<div class="dechirures"></div>

            <!-- ============================= -->
            <!-- En-tête -->
            <!-- ============================= -->

            <header class="entete">

                <h1 class="titre-principal">
                    Le Dernier Secret du Garde
                </h1>

                <div class="ornement"></div>

                <p class="message-garde">
                    Message du Garde
                </p>

            </header>

            <!-- ============================= -->
            <!-- Contenu -->
            <!-- ============================= -->

            <section class="contenu">

                <h2 id="titre"></h2>

                <div class="citation-garde"></div>

                <div id="enigme"></div>

            </section>

            <!-- ============================= -->
            <!-- Réponse -->
            <!-- ============================= -->

            <section class="zone-reponse">

                <label for="reponse" class="titre-reponse">
                    Votre réponse
                </label>

                <input
                    type="text"
                    id="reponse"
                    placeholder="Saisissez votre réponse"
                    autocomplete="off">

                <button
                    id="btnValider"
                    type="button"
                    onclick="verifier()">

                    Valider

                </button>

            </section>

            <!-- ============================= -->
            <!-- Message -->
            <!-- ============================= -->

            <section class="zone-message">

                <div id="message"></div>

            </section>

            <!-- ============================= -->
            <!-- Signature -->
            <!-- ============================= -->

            <footer class="signature">

                <span>Le Garde veille encore...</span>

            </footer>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
